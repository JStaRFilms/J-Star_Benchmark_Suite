<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Star Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        background: 'var(--bg)',
                        surface: 'var(--surface)',
                        surfaceHighlight: 'var(--surface-highlight)',
                        border: 'var(--border)',
                        primary: '#6d28d9', primaryGlow: '#8b5cf6', accent: '#06b6d4',
                        success: '#10b981', warning: '#f59e0b', error: '#ef4444',
                        text: { main: 'var(--text-main)', muted: 'var(--text-muted)', dim: 'var(--text-dim)' }
                    },
                    boxShadow: { 'neon': 'var(--shadow-neon)', 'card': 'var(--shadow-card)' }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f8fafc;
            --surface-highlight: #e2e8f0;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --shadow-neon: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .dark {
            --bg: #0a0a0c;
            --surface: #121216;
            --surface-highlight: #1e1e24;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #4b5563;
            --shadow-neon: 0 0 15px rgba(139, 92, 246, 0.3);
            --shadow-card: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .glass-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
        }

        .dark .glass-panel {
            background: rgba(18, 18, 22, 0.7);
            backdrop-filter: blur(12px);
        }

        .nav-item.active {
            background: rgba(139, 92, 246, 0.1);
            border-left: 3px solid theme('colors.primary');
            color: var(--text-main);
        }

        html:not(.dark) .nav-item.active {
            background: #eff6ff;
            color: theme('colors.primary');
        }

        .nav-item {
            border-left: 3px solid transparent;
        }
    </style>
</head>

<body class="antialiased h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-surface border-r border-border flex flex-col z-20 transition-colors">
        <div class="h-16 flex items-center px-6 border-b border-border">
            <span class="text-xl font-bold tracking-tight text-text-main">J-Star <span
                    class="text-primaryGlow">Bench</span></span>
        </div>
        <nav class="flex-1 py-6 space-y-1">
            <a href="home.html"
                class="nav-item flex items-center px-6 py-3 text-sm font-medium text-text-muted hover:text-text-main transition-colors">
                <i data-lucide="layout-dashboard" class="w-4 h-4 mr-3"></i> Dashboard
            </a>
            <a href="run-details.html"
                class="nav-item flex items-center px-6 py-3 text-sm font-medium text-text-muted hover:text-text-main transition-colors">
                <i data-lucide="list" class="w-4 h-4 mr-3"></i> Runs
            </a>
            <a href="live-battle.html"
                class="nav-item flex items-center px-6 py-3 text-sm font-medium text-text-muted hover:text-text-main transition-colors">
                <i data-lucide="swords" class="w-4 h-4 mr-3"></i> Live Battle
            </a>
            <a href="configuration.html"
                class="nav-item active flex items-center px-6 py-3 text-sm font-medium transition-colors">
                <i data-lucide="settings" class="w-4 h-4 mr-3"></i> Configuration
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative overflow-hidden">

        <!-- Header -->
        <header
            class="h-16 border-b border-border flex items-center justify-between px-8 z-10 bg-background/50 backdrop-blur-sm sticky top-0">
            <h1 class="text-lg font-semibold text-text-main">Settings & Configuration</h1>
            <div class="flex items-center space-x-4">
                <button onclick="document.documentElement.classList.toggle('dark')"
                    class="p-2 rounded-lg hover:bg-surfaceHighlight text-text-muted transition-colors">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </header>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-8 z-10 space-y-8 max-w-3xl">

            <!-- Model Settings -->
            <section class="space-y-4">
                <h2 class="text-lg font-medium text-text-main border-l-4 border-primary pl-3">Ollama Connection</h2>
                <div class="glass-panel p-6 rounded-xl space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-text-muted mb-1 uppercase">Local Endpoint</label>
                        <div class="flex gap-2">
                            <input type="text" value="http://localhost:11434"
                                class="flex-1 bg-background border border-border rounded-lg px-4 py-2.5 text-text-main font-mono text-sm focus:outline-none focus:border-primary transition-all">
                            <button
                                class="bg-surfaceHighlight hover:bg-border text-text-main px-4 py-2.5 rounded-lg border border-border text-sm font-medium transition-all">Test</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Prompts -->
            <section class="space-y-4">
                <h2 class="text-lg font-medium text-text-main border-l-4 border-accent pl-3">Test Prompts</h2>
                <div class="glass-panel p-6 rounded-xl space-y-6">

                    <!-- Prompt Item -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="block text-sm font-medium text-text-main">FFmpeg Mosaic Test</label>
                            <span class="text-xs text-text-muted italic">Weights: Logic 60%, Vibe 40%</span>
                        </div>
                        <textarea
                            class="w-full bg-background border border-border rounded-lg px-4 py-3 text-text-main font-mono text-xs focus:outline-none focus:border-accent transition-all h-24 resize-none">Create a 2x2 video grid using ffmpeg filter_complex...</textarea>
                    </div>

                    <div class="border-t border-border"></div>

                    <!-- Prompt Item -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="block text-sm font-medium text-text-main">Canvas Shapes Test</label>
                            <span class="text-xs text-text-muted italic">Weights: Logic 40%, Vibe 60%</span>
                        </div>
                        <textarea
                            class="w-full bg-background border border-border rounded-lg px-4 py-3 text-text-main font-mono text-xs focus:outline-none focus:border-accent transition-all h-24 resize-none">Write an HTML5 canvas script that draws a rotating 3D cube...</textarea>
                    </div>

                </div>
            </section>

        </div>
    </main>

    <script> lucide.createIcons(); </script>
</body>

</html>
